<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    /* 기본(라이트모드): 검은색 네모 */
    .favicon-box { fill: #111111; }

    /* 다크모드 감지 시: 하얀색 네모로 자동 전환 */
    @media (prefers-color-scheme: dark) {
      .favicon-box { fill: #ffffff; }
    }
  </style>

  <!-- <g> 태그로 묶어둔 네모 박스 영역 -->
  <g>
    <rect width="32" height="32" rx="4" class="favicon-box" />
  </g>
</svg>
